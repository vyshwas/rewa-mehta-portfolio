<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="24" fill="#07080C"/>
  <defs>
    <radialGradient id="v-glow" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#043bd6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07080C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="50%" stop-color="#11131a"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0b973"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#v-glow)"/>

  <!-- Phone Mockup 1 (Main Centered) -->
  <g transform="translate(420, 80)">
    <!-- Shadow & Chassis -->
    <rect x="0" y="0" width="360" height="660" rx="46" fill="#14161f" stroke="#2a2e40" stroke-width="3" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.9))"/>
    <!-- Screen Inner -->
    <rect x="10" y="10" width="340" height="640" rx="38" fill="#0A0B10"/>
    
    <!-- Dynamic Island -->
    <rect x="120" y="24" width="100" height="24" rx="12" fill="#000000"/>
    
    <!-- Balance Header -->
    <text x="35" y="95" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="12" letter-spacing="1">TOTAL ASSETS ALLOCATION</text>
    <text x="35" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="700">\$4,829,140</text>
    <text x="35" y="168" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">+18.4% YTD (+\$752,300)</text>

    <!-- Sleek Chart -->
    <path d="M 35 270 C 90 260, 130 220, 180 230 C 230 240, 270 180, 310 190" fill="none" stroke="#043bd6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 35 270 C 90 260, 130 220, 180 230 C 230 240, 270 180, 310 190 L 310 300 L 35 300 Z" fill="url(#v-glow)" opacity="0.3"/>

    <!-- High Net Worth Card Widget -->
    <rect x="30" y="320" width="280" height="150" rx="18" fill="url(#metal-card)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <circle cx="60" cy="355" r="16" fill="rgba(4,59,214,0.3)" stroke="#043bd6"/>
    <text x="90" y="354" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Apex Obsidian Reserve</text>
    <text x="90" y="370" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="11">••• 8842 · Private Vault</text>
    <text x="60" y="440" fill="url(#gold-accent)" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2">VALENCE BLACK TIER</text>

    <!-- Recent Yields -->
    <rect x="30" y="490" width="280" height="60" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="50" y="525" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Autonomous Yield Index</text>
    <text x="240" y="525" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">+8.6%</text>
  </g>

  <!-- Left Supporting Floating Card -->
  <rect x="80" y="240" width="280" height="320" rx="20" fill="rgba(16,18,26,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
  <text x="110" y="280" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5">LIQUIDITY STRESS TEST</text>
  <text x="110" y="325" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">AAA Grade</text>
  <circle cx="220" cy="430" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
  <circle cx="220" cy="430" r="60" fill="none" stroke="#043bd6" stroke-width="12" stroke-dasharray="280 100" stroke-linecap="round"/>
  <text x="200" y="438" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">89%</text>

  <!-- Right Supporting Floating Card -->
  <rect x="840" y="260" width="280" height="280" rx="20" fill="rgba(16,18,26,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
  <text x="870" y="305" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5">PORTFOLIO SHIELD</text>
  <text x="870" y="350" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Haptic Auth</text>
  <rect x="870" y="390" width="220" height="42" rx="10" fill="rgba(4,59,214,0.2)" stroke="#043bd6"/>
  <text x="915" y="416" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">BIOMETRIC SECURED</text>
</svg>