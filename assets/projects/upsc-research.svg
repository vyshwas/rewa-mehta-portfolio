<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="24" fill="#09090E"/>
  <defs>
    <radialGradient id="u-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#043bd6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09090E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#u-glow)"/>

  <!-- Central Systems Diagram Frame -->
  <rect x="100" y="100" width="1000" height="600" rx="20" fill="#11131C" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <text x="150" y="160" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2">SYSTEMIC UX RESEARCH // NIFT DELHI</text>
  <text x="150" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Survival of the Fittest: UPSC Ecosystem</text>

  <!-- 3 Pillar Crisis Nodes -->
  <g transform="translate(200, 340)">
    <circle cx="0" cy="0" r="70" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Financial</text>
    <text x="0" y="18" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Strain & Rent</text>
  </g>

  <g transform="translate(600, 340)">
    <circle cx="0" cy="0" r="90" fill="rgba(4,59,214,0.15)" stroke="#043bd6" stroke-width="3"/>
    <text x="0" y="-10" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Mental Health</text>
    <text x="0" y="15" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Isolation Crisis</text>
    <text x="0" y="35" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Primary & Secondary Data</text>
  </g>

  <g transform="translate(1000, 340)">
    <circle cx="0" cy="0" r="70" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Infrastructure</text>
    <text x="0" y="18" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Resource Gaps</text>
  </g>

  <!-- Connecting Tension Lines -->
  <line x1="270" y1="340" x2="510" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="690" y1="340" x2="930" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Proposed User-Centric Interventions -->
  <rect x="150" y="490" width="900" height="150" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="180" y="530" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PROPOSED DESIGN INTERVENTIONS</text>
  <text x="180" y="565" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15">1. Peer Support Micro-Communities · 2. Transparent Housing Rental Registry · 3. Decentralized Study Hubs</text>
  <text x="180" y="600" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="12">Extensive qualitative ethnographic interviews with aspirants across Old Rajinder Nagar and Mukherjee Nagar.</text>
</svg>