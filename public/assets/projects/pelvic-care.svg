<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="24" fill="#0A0B10"/>
  <defs>
    <radialGradient id="p-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#043bd6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#p-glow)"/>

  <!-- Phone Mockup Center -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="360" height="660" rx="44" fill="#12141c" stroke="#25293d" stroke-width="2.5" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.85))"/>
    <rect x="10" y="10" width="340" height="640" rx="36" fill="#0c0e15"/>
    <rect x="120" y="22" width="100" height="22" rx="11" fill="#000"/>

    <text x="32" y="85" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">POSTPARTUM WELLNESS AI</text>
    <text x="32" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Pelvic Recovery</text>

    <!-- AI Motion Detection Ring -->
    <circle cx="170" cy="240" r="75" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
    <circle cx="170" cy="240" r="75" fill="none" stroke="#043bd6" stroke-width="12" stroke-dasharray="360 110" stroke-linecap="round"/>
    <circle cx="170" cy="240" r="58" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="170" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">94%</text>
    <text x="170" y="262" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ALIGNMENT OK</text>

    <!-- Biofeedback Waveform -->
    <rect x="25" y="345" width="290" height="110" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="42" y="375" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="12">Contraction Symmetry</text>
    <path d="M 42 420 Q 90 380 130 420 T 210 400 T 290 415" fill="none" stroke="#043bd6" stroke-width="3" stroke-linecap="round"/>

    <!-- Daily Routine Card -->
    <rect x="25" y="475" width="290" height="65" rx="14" fill="rgba(4,59,214,0.15)" stroke="#043bd6" stroke-width="1"/>
    <circle cx="55" cy="507" r="14" fill="#043bd6"/>
    <polygon points="53,501 60,507 53,513" fill="#ffffff"/>
    <text x="82" y="503" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Guided Core Activation</text>
    <text x="82" y="520" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11">Session 3 of 8 · 6 mins</text>
  </g>

  <!-- Left Side Research Metric Card -->
  <rect x="80" y="220" width="280" height="340" rx="20" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
  <text x="110" y="265" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">AKOODE TECHNOLOGIES</text>
  <text x="110" y="305" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">AI Pose Telemetry</text>
  <text x="110" y="340" fill="rgba(255,255,255,0.65)" font-family="system-ui, sans-serif" font-size="13">
    <tspan x="110" dy="0">Real-time computer vision</tspan>
    <tspan x="110" dy="20">guidance tailored for</tspan>
    <tspan x="110" dy="20">postpartum rehabilitation,</tspan>
    <tspan x="110" dy="20">with empathy and privacy.</tspan>
  </text>
  <rect x="110" y="430" width="220" height="40" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
  <text x="135" y="455" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACCESSIBILITY FIRST</text>

  <!-- Right Side UX Flow Card -->
  <rect x="840" y="220" width="280" height="340" rx="20" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
  <text x="870" y="265" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">DESIGNED AROUND PEOPLE</text>
  <text x="870" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Daily care</text>
  <text x="870" y="345" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="13">Clear guidance. Considered feedback.</text>
  <line x1="870" y1="400" x2="1080" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="870" y="440" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">M.Des Research Foundation</text>
</svg>