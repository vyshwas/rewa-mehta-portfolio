<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="24" fill="#0A0B10"/>
  <defs>
    <radialGradient id="a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#043bd6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#a-glow)"/>

  <!-- Console Surface -->
  <rect x="100" y="100" width="1000" height="600" rx="24" fill="#12141c" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Frequency Spectrum Waves -->
  <g opacity="0.8">
    <path d="M 150 400 Q 250 150 350 400 T 550 400 T 750 400 T 950 400 T 1050 400" fill="none" stroke="#043bd6" stroke-width="3"/>
    <path d="M 150 400 Q 250 250 350 400 T 550 400 T 750 200 T 950 400 T 1050 400" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <path d="M 150 400 Q 250 350 350 400 T 550 400 T 750 320 T 950 400 T 1050 400" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- 4 Big Tactile Dial Knobs -->
  <g transform="translate(250, 240)">
    <circle cx="0" cy="0" r="50" fill="#1a1d28" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="#11131a"/>
    <line x1="0" y1="-38" x2="0" y2="-20" stroke="#043bd6" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="75" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">RESONANCE</text>
  </g>
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="50" fill="#1a1d28" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="#11131a"/>
    <line x1="25" y1="-25" x2="12" y2="-12" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="75" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MODULATION</text>
  </g>
  <g transform="translate(710, 240)">
    <circle cx="0" cy="0" r="50" fill="#1a1d28" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="#11131a"/>
    <line x1="-25" y1="-25" x2="-12" y2="-12" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="75" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">HARMONICS</text>
  </g>
  <g transform="translate(940, 240)">
    <circle cx="0" cy="0" r="50" fill="#1a1d28" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="#11131a"/>
    <line x1="0" y1="38" x2="0" y2="20" stroke="#043bd6" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="75" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SPATIAL PAN</text>
  </g>

  <!-- Equalizer Sliders Bar -->
  <g transform="translate(180, 520)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <!-- 8 vertical sliders -->
    <line x1="60" y1="-40" x2="60" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="-10" r="10" fill="#043bd6" stroke="#fff" stroke-width="2"/>

    <line x1="160" y1="-40" x2="160" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="20" r="10" fill="#043bd6" stroke="#fff" stroke-width="2"/>

    <line x1="260" y1="-40" x2="260" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="-30" r="10" fill="#38bdf8" stroke="#fff" stroke-width="2"/>

    <line x1="360" y1="-40" x2="360" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="360" cy="5" r="10" fill="#043bd6" stroke="#fff" stroke-width="2"/>

    <line x1="460" y1="-40" x2="460" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="460" cy="-25" r="10" fill="#043bd6" stroke="#fff" stroke-width="2"/>

    <line x1="560" y1="-40" x2="560" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="560" cy="30" r="10" fill="#818cf8" stroke="#fff" stroke-width="2"/>

    <line x1="660" y1="-40" x2="660" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="660" cy="-15" r="10" fill="#043bd6" stroke="#fff" stroke-width="2"/>

    <line x1="760" y1="-40" x2="760" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="760" cy="10" r="10" fill="#043bd6" stroke="#fff" stroke-width="2"/>
  </g>
</svg>